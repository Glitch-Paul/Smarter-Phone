<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <style>
    body { 
      background-color: #191919; /* Notion Dark Mode */
      display: flex; justify-content: center; align-items: center; 
      height: 100vh; margin: 0; font-family: sans-serif; 
      cursor: pointer; user-select: none; color: rgba(255,255,255,0.7); 
    }
    .timer-ring { width: 160px; height: 160px; position: relative; }
    svg { transform: rotate(-90deg); width: 100%; height: 100%; }
    .bg-ring { fill: none; stroke: #333; stroke-width: 6; }
    .progress-ring { 
      fill: none; stroke: #E53935; stroke-width: 6; 
      stroke-linecap: round; transition: stroke-dashoffset 1s linear; 
    }
    .time-text { 
      position: absolute; top: 50%; left: 50%; 
      transform: translate(-50%, -50%); font-size: 32px; font-weight: 600; 
    }
  </style>
</head>
<body>
  <div class="timer-ring" onclick="toggleTimer()">
    <svg viewBox="0 0 100 100">
      <circle class="bg-ring" cx="50" cy="50" r="45"></circle>
      <circle class="progress-ring" cx="50" cy="50" r="45" id="ring"></circle>
    </svg>
    <div class="time-text" id="time">90m</div>
  </div>

  <script>
    const START_MINUTES = 90; // Hier deine Dauer ändern (z.B. 30 oder 90)
    let totalSecs = START_MINUTES * 60, timeLeft = totalSecs, timerId = null;
    const ring = document.getElementById('ring'), timeText = document.getElementById('time');
    const circ = 2 * Math.PI * 45;
    ring.style.strokeDasharray = circ;

    // Autarker Synthesizer-Alarm (benötigt keine externen Audio-Dateien)
    function playAlarm() {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = ctx.createOscillator(), gain = ctx.createGain();
      osc.connect(gain); gain.connect(ctx.destination);
      osc.frequency.value = 600; // Tonhöhe
      gain.gain.setValueAtTime(1, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 1.5);
      osc.start(); osc.stop(ctx.currentTime + 1.5);
    }

    function update() {
      timeText.innerText = Math.ceil(timeLeft / 60) + 'm';
      ring.style.strokeDashoffset = circ - (timeLeft / totalSecs) * circ;
    }

    function toggleTimer() {
      if (timerId) { 
        clearInterval(timerId); timerId = null; // Pause
      } else {
        if (timeLeft <= 0) timeLeft = totalSecs; // Reset nach Ablauf
        update();
        timerId = setInterval(() => {
          timeLeft--; update();
          if (timeLeft <= 0) { 
            clearInterval(timerId); timerId = null; 
            playAlarm(); timeText.innerText = "0m"; 
          }
        }, 1000);
      }
    }
    update();
  </script>
</body>
</html>
